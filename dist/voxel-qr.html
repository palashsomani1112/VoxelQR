<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel QR, single file</title>
<meta name="description" content="Turn a link, contact card or Wi-Fi login into a pastel isometric diorama that flips to reveal a scannable QR code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --backdrop: #2f3a36;
  --on-backdrop: #f3f1e8;
  --on-backdrop-soft: #b7c1ba;
  --tray: #f6f4ee;
  --tray-edge: #dcd8cd;
  --ink: #232c28;
  --ink-soft: #55615b;
  --focus: #1d5c8a;
  --sans: 'Karla', 'Helvetica Neue', Arial, sans-serif;
  --display: 'Baloo 2', 'Trebuchet MS', sans-serif;
  --tap: 44px;
  --rail: 46px;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  background: var(--backdrop);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.skip {
  position: absolute;
  left: 8px;
  top: -60px;
  z-index: 20;
  padding: 10px 14px;
  background: var(--tray);
  color: var(--ink);
  border-radius: 8px;
  text-decoration: none;
}

.skip:focus { top: 8px; }

:where(button, a, summary, input, select, textarea):focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}

.shell {
  display: grid;
  grid-template-areas: "content viewer" "style style";
  grid-template-columns: 350px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  height: 100%;
}

.shell.content-closed { grid-template-columns: var(--rail) minmax(0, 1fr); }

.shell.content-closed .drawer-content { grid-template-rows: minmax(0, 1fr); }

/* Drawers */

.drawer {
  background: var(--tray);
  min-width: 0;
  min-height: 0;
}

.drawer-content {
  grid-area: content;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  border-right: 1px solid rgba(0, 0, 0, 0.35);
  overflow: hidden;
}

.drawer-content::details-content {
  min-height: 0;
  height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

.drawer-style {
  grid-area: style;
  border-top: 1px solid rgba(0, 0, 0, 0.35);
}

.drawer-tab {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: var(--tap);
  padding: 10px 16px;
  font: 500 16px/1 var(--display);
  color: var(--ink);
  cursor: pointer;
  list-style: none;
  border-bottom: 1px solid var(--tray-edge);
}

.drawer-tab::-webkit-details-marker { display: none; }

.drawer-tab:focus-visible { outline-offset: -3px; }

.drawer-state {
  width: 22px;
  height: 22px;
  flex: none;
  border: 1px solid var(--ink-soft);
  border-radius: 6px;
  position: relative;
}

.drawer-state::before,
.drawer-state::after {
  content: "";
  position: absolute;
  background: var(--ink-soft);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.drawer-state::before { width: 10px; height: 2px; }
.drawer-state::after { width: 2px; height: 10px; }
.drawer[open] .drawer-state::after { display: none; }

.drawer-body {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 16px;
}

.drawer-content[open] .drawer-body { padding-bottom: 32px; }

.shell.content-closed .drawer-content .drawer-tab {
  writing-mode: vertical-rl;
  justify-content: flex-start;
  padding: 16px 10px;
  border-bottom: 0;
  border-left: 1px solid var(--tray-edge);
  height: 100%;
}

.drawer-style .drawer-body {
  max-height: 42dvh;
  padding: 14px 16px 18px;
}

.drawer-content > .drawer-body { max-height: 100dvh; }

/* Viewer */

.viewer {
  grid-area: viewer;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  padding: 20px 22px 14px;
}

.brand h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 28px;
  color: var(--on-backdrop);
}

.brand p {
  margin: 3px 0 0;
  color: var(--on-backdrop-soft);
  max-width: 46ch;
}

.stage-wrap {
  position: relative;
  flex: 1;
  min-height: 240px;
  margin-top: 14px;
}

.stage {
  position: absolute;
  inset: 0;
  cursor: pointer;
  border-radius: 16px;
  touch-action: manipulation;
}

.stage canvas { display: block; width: 100%; height: 100%; }

.overlay {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 90ms linear;
  image-rendering: pixelated;
}

.flat-fallback {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(72%, 400px);
  height: auto;
  transform: translate(-50%, -50%);
  border-radius: 10px;
  background: #fff;
}

.viewer-foot {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 12px;
  min-height: var(--tap);
}

.toggle {
  min-height: var(--tap);
  padding: 10px 16px;
  font: 500 15px/1 var(--sans);
  color: var(--on-backdrop);
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 10px;
  cursor: pointer;
}

.toggle:hover { background: rgba(255, 255, 255, 0.2); }

.hint {
  margin: 0;
  color: var(--on-backdrop-soft);
  opacity: 0;
  transition: opacity 160ms ease;
}

.hint.is-on { opacity: 1; }

/* Content panel */

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.tab {
  min-height: 36px;
  padding: 7px 12px;
  font: 500 13px/1 var(--sans);
  border: 1px solid var(--tray-edge);
  border-radius: 999px;
  background: #fff;
  color: var(--ink-soft);
  cursor: pointer;
}

.tab:hover { border-color: #b3ac9c; }

.tab.is-on {
  background: var(--ink);
  border-color: var(--ink);
  color: #f7f5ef;
}

.lead {
  margin: 0 0 14px;
  font-size: 13px;
  color: var(--ink-soft);
}

.form { display: grid; gap: 14px; }

.rows {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.field-full { grid-column: 1 / -1; }
.field-half { grid-column: span 1; }

.field { display: grid; gap: 4px; align-content: start; }

.field-label, .well-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
}

.field-hint {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--ink-soft);
}

.field-check {
  display: flex;
  align-items: center;
  gap: 10px;
  grid-column: 1 / -1;
}

.check-label { font-size: 13px; color: var(--ink); }

input[type="text"], input[type="url"], input[type="tel"],
input[type="email"], input[type="password"], input[type="number"],
textarea, select {
  width: 100%;
  min-height: var(--tap);
  padding: 9px 10px;
  font: 400 16px/1.4 var(--sans);
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--tray-edge);
  border-radius: 8px;
}

textarea { min-height: 72px; resize: vertical; }

input[type="checkbox"] {
  width: 22px;
  height: 22px;
  margin: 0;
  flex: none;
  accent-color: var(--ink);
}

.subgroup {
  border: 1px solid var(--tray-edge);
  border-radius: 10px;
  padding: 10px 12px 12px;
  margin: 0;
  background: rgba(255, 255, 255, 0.5);
}

.subgroup summary, .subgroup legend {
  font: 500 13px/1 var(--sans);
  color: var(--ink);
  cursor: pointer;
  padding: 4px 0;
  min-height: 28px;
  display: flex;
  align-items: center;
}

.subgroup legend { cursor: default; padding: 0 6px; }
.subgroup[open] summary { margin-bottom: 8px; }

.reveal { margin-top: 16px; }

.reveal summary {
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  min-height: 32px;
  display: flex;
  align-items: center;
}

.reveal-text {
  margin: 8px 0 0;
  padding: 10px;
  max-height: 160px;
  overflow: auto;
  font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: #fff;
  border: 1px solid var(--tray-edge);
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-all;
}

/* Style panel */

.meter {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--ink-soft);
}

.meter.is-warning { color: #8a4f16; }
.meter-note { display: block; }

.shelf {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
  align-items: start;
}

.choice {
  border: 1px solid var(--tray-edge);
  border-radius: 10px;
  padding: 6px 12px 12px;
  margin: 0;
  min-width: 0;
}

.choice legend {
  font: 500 13px/1 var(--sans);
  color: var(--ink);
  padding: 0 6px;
}

.choice-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.choice-item {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 10px;
  border: 1px solid var(--tray-edge);
  border-radius: 999px;
  background: #fff;
  font: 400 13px/1 var(--sans);
  color: var(--ink-soft);
  cursor: pointer;
}

.choice-item:hover { border-color: #b3ac9c; }

.choice-item.is-on {
  border-color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ink);
  color: var(--ink);
}

.chips { display: inline-flex; gap: 2px; flex: none; }

.chip {
  width: 13px;
  height: 13px;
  border-radius: 4px;
  border: 1px solid rgba(0, 0, 0, 0.12);
}

.chip-none {
  background:
    linear-gradient(45deg, transparent 45%, #b3ac9c 45%, #b3ac9c 55%, transparent 55%),
    #fff;
}

.well-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}

.well {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas: "label label" "picker hex";
  gap: 4px 6px;
  align-items: center;
}

.well-label { grid-area: label; }

input[type="color"] {
  grid-area: picker;
  width: 40px;
  height: var(--tap);
  padding: 2px;
  border: 1px solid var(--tray-edge);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
}

.well-hex {
  grid-area: hex;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}

.code-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  align-items: end;
}

.dice {
  min-height: var(--tap);
  padding: 11px 14px;
  font: 500 15px/1 var(--display);
  border: 1px solid var(--ink);
  border-radius: 10px;
  background: var(--ink);
  color: #f7f5ef;
  cursor: pointer;
}

.dice:hover { background: #33403a; }

.exports {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 8px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--tray-edge);
}

.action {
  min-height: var(--tap);
  padding: 10px 12px;
  font: 400 14px/1.2 var(--sans);
  text-align: left;
  border: 1px solid var(--tray-edge);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
}

.action:hover { border-color: #b3ac9c; }

/* Share and feedback */

.share {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--tray-edge);
  border-radius: 10px;
  background: #fff;
  display: grid;
  gap: 8px;
}

.share-text {
  width: 100%;
  font: 400 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  resize: vertical;
  word-break: break-all;
}

.share-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.share-row .action { flex: 1 1 140px; text-align: center; }

.share-copy { border-color: var(--ink); color: var(--ink); font-weight: 500; }

.share-close { color: var(--ink-soft); }

.toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  z-index: 30;
  transform: translate(-50%, 12px);
  margin: 0;
  max-width: min(90vw, 520px);
  padding: 12px 18px;
  font-size: 14px;
  color: #f7f5ef;
  background: #1d2521;
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  opacity: 0;
  pointer-events: none;
  transition: opacity 140ms ease, transform 140ms ease;
}

.toast.is-on {
  opacity: 1;
  transform: translate(-50%, 0);
}

.toast:empty { display: none; }

/* Embed and present */

body.is-embed { background: transparent; }

body.is-embed .stage-wrap {
  position: fixed;
  inset: 0;
  margin: 0;
}

body.is-presenting .drawer,
body.is-presenting .brand,
body.is-presenting .toast,
body.is-presenting .viewer-foot { display: none; }

body.is-presenting .viewer { padding: 0; }

body.is-presenting .shell {
  grid-template-areas: "viewer";
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}

/* Responsive */

@media (max-width: 1000px) {
  .shell, .shell.content-closed {
    grid-template-areas: "viewer" "content" "style";
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto;
    height: auto;
    min-height: 100%;
  }

  .viewer { padding: 16px 16px 10px; }

  .stage-wrap {
    height: min(52vh, 460px);
    flex: none;
  }

  .drawer-content {
    border-right: 0;
    border-top: 1px solid rgba(0, 0, 0, 0.35);
    display: block;
  }

  .shell.content-closed .drawer-content .drawer-tab {
    writing-mode: horizontal-tb;
    height: auto;
    padding: 10px 16px;
    border-left: 0;
  }

  .drawer-body, .drawer-style .drawer-body, .drawer-content > .drawer-body { max-height: none; }
  .drawer-content, .drawer-content::details-content { overflow: visible; height: auto; }
  .brand h1 { font-size: 24px; }
}

@media (max-width: 560px) {
  .rows { grid-template-columns: minmax(0, 1fr); }
  .field-half { grid-column: 1 / -1; }
  .shelf { grid-template-columns: minmax(0, 1fr); }
  .exports { grid-template-columns: minmax(0, 1fr); }
  .stage-wrap { height: min(46vh, 380px); }
  .brand p { font-size: 14px; }
}

@media (pointer: coarse) {
  .tab, .choice-item, .subgroup summary, .reveal summary { min-height: var(--tap); }
}

@media (prefers-reduced-motion: reduce) {
  .overlay, .hint, .toggle, .stage { transition: none; }
  .toast { transition: none; transform: translate(-50%, 0); }
}

@media (prefers-contrast: more) {
  :root { --tray-edge: #6b665c; --ink-soft: #3a423d; }
  .choice-item.is-on { box-shadow: inset 0 0 0 2px var(--ink); }
}

.drawer-title { display: block; }

.choice-label { white-space: nowrap; }

.choice-wells legend, .choice-code legend { color: var(--ink); }

.subgroup-open { padding-top: 4px; }

.stage.is-flat { cursor: default; }

</style>

<body>
<a class="skip" href="#viewer">Skip to the scene</a>
<div class="shell" id="shell">

  <details class="drawer drawer-content" id="content-drawer" open>
    <summary class="drawer-tab">
      <span class="drawer-title">Content</span>
      <span class="drawer-state" aria-hidden="true"></span>
    </summary>
    <div class="drawer-body" id="content-panel"></div>
  </details>

  <section class="viewer" id="viewer" aria-label="Scene">
    <header class="brand">
      <h1>Voxel QR</h1>
      <p>Hover or tap the scene. It settles into a code you can scan.</p>
    </header>
    <div class="stage-wrap">
      <div id="stage" class="stage"></div>
      <canvas id="overlay" class="overlay" aria-hidden="true"></canvas>
    </div>
    <div class="viewer-foot">
      <button type="button" id="toggle" class="toggle" aria-pressed="false">Show the code</button>
      <p id="hint" class="hint">Point a camera at it.</p>
    </div>
  </section>

  <details class="drawer drawer-style" id="style-drawer" open>
    <summary class="drawer-tab">
      <span class="drawer-title">Look</span>
      <span class="drawer-state" aria-hidden="true"></span>
    </summary>
    <div class="drawer-body" id="style-panel"></div>
  </details>

</div>
<p id="toast" class="toast" role="status" aria-live="polite"></p>
<script type="module">
import * as THREE from 'three';

const EXP = new Uint8Array(512);
const LOG = new Uint8Array(256);

for (let i = 0, x = 1; i < 255; i++) {
  EXP[i] = x;
  LOG[x] = i;
  x <<= 1;
  if (x & 0x100) x ^= 0x11d;
}
for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

function gmul(a, b) {
  if (a === 0 || b === 0) return 0;
  return EXP[LOG[a] + LOG[b]];
}

function generatorPoly(degree) {
  let poly = [1];
  for (let d = 0; d < degree; d++) {
    const next = new Array(poly.length + 1).fill(0);
    for (let i = 0; i < poly.length; i++) {
      next[i] ^= poly[i];
      next[i + 1] ^= gmul(poly[i], EXP[d]);
    }
    poly = next;
  }
  return poly;
}

function remainder(data, degree) {
  const gen = generatorPoly(degree);
  const out = new Array(degree).fill(0);
  for (const byte of data) {
    const factor = byte ^ out[0];
    out.shift();
    out.push(0);
    if (factor !== 0) {
      for (let i = 0; i < degree; i++) out[i] ^= gmul(gen[i + 1], factor);
    }
  }
  return out;
}

const TOTAL_CODEWORDS = [26, 44, 70, 100, 134, 172, 196, 242, 292, 346];

const MAX_VERSION = TOTAL_CODEWORDS.length;

const ALIGN_CENTERS = [
  [], [6, 18], [6, 22], [6, 26], [6, 30],
  [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50],
];

const EC_LEVELS = { L: 1, M: 0, Q: 3, H: 2 };

// [ecPerBlock, blocksInGroup1, dataPerBlockGroup1, blocksInGroup2, dataPerBlockGroup2]
const EC_BLOCKS = {
  L: [
    [7, 1, 19, 0, 0], [10, 1, 34, 0, 0], [15, 1, 55, 0, 0], [20, 1, 80, 0, 0], [26, 1, 108, 0, 0],
    [18, 2, 68, 0, 0], [20, 2, 78, 0, 0], [24, 2, 97, 0, 0], [30, 2, 116, 0, 0], [18, 2, 68, 2, 69],
  ],
  M: [
    [10, 1, 16, 0, 0], [16, 1, 28, 0, 0], [26, 1, 44, 0, 0], [18, 2, 32, 0, 0], [24, 2, 43, 0, 0],
    [16, 4, 27, 0, 0], [18, 4, 31, 0, 0], [22, 2, 38, 2, 39], [22, 3, 36, 2, 37], [26, 4, 43, 1, 44],
  ],
  Q: [
    [13, 1, 13, 0, 0], [22, 1, 22, 0, 0], [18, 2, 17, 0, 0], [26, 2, 24, 0, 0], [18, 2, 15, 2, 16],
    [24, 4, 19, 0, 0], [18, 2, 14, 4, 15], [22, 4, 18, 2, 19], [20, 4, 16, 4, 17], [24, 6, 19, 2, 20],
  ],
  H: [
    [17, 1, 9, 0, 0], [28, 1, 16, 0, 0], [22, 2, 13, 0, 0], [16, 4, 9, 0, 0], [22, 2, 11, 2, 12],
    [28, 4, 15, 0, 0], [26, 4, 13, 1, 14], [26, 4, 14, 2, 15], [24, 4, 12, 4, 13], [28, 6, 15, 2, 16],
  ],
};

function blockLayout(version, level) {
  const [ec, n1, d1, n2, d2] = EC_BLOCKS[level][version - 1];
  const blocks = [];
  for (let i = 0; i < n1; i++) blocks.push({ data: d1, ec });
  for (let i = 0; i < n2; i++) blocks.push({ data: d2, ec });
  return blocks;
}

function dataCapacityBytes(version, level) {
  return blockLayout(version, level).reduce((sum, b) => sum + b.data, 0);
}

const ALNUM = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';

function pickMode(text) {
  if (/^[0-9]*$/.test(text)) return 'numeric';
  let alnum = true;
  for (const ch of text) if (ALNUM.indexOf(ch) < 0) alnum = false;
  return alnum ? 'alnum' : 'byte';
}

const MODE_BITS = { numeric: 1, alnum: 2, byte: 4 };
const COUNT_BITS = { numeric: [10, 12], alnum: [9, 11], byte: [8, 16] };

function countBits(mode, version) {
  return COUNT_BITS[mode][version <= 9 ? 0 : 1];
}

class Bits {
  constructor() {
    this.bytes = [];
    this.length = 0;
  }
  put(value, width) {
    for (let i = width - 1; i >= 0; i--) this.putBit(((value >>> i) & 1) === 1);
  }
  putBit(on) {
    const index = this.length >>> 3;
    if (this.bytes.length <= index) this.bytes.push(0);
    if (on) this.bytes[index] |= 0x80 >>> (this.length & 7);
    this.length++;
  }
}

function utf8(text) {
  return Array.from(new TextEncoder().encode(text));
}

function encodeSegment(bits, text, mode, version) {
  bits.put(MODE_BITS[mode], 4);
  if (mode === 'byte') {
    const bytes = utf8(text);
    bits.put(bytes.length, countBits(mode, version));
    for (const b of bytes) bits.put(b, 8);
    return;
  }
  bits.put(text.length, countBits(mode, version));
  if (mode === 'numeric') {
    for (let i = 0; i < text.length; i += 3) {
      const chunk = text.slice(i, i + 3);
      bits.put(parseInt(chunk, 10), chunk.length * 3 + 1);
    }
    return;
  }
  for (let i = 0; i < text.length; i += 2) {
    if (i + 1 < text.length) {
      bits.put(ALNUM.indexOf(text[i]) * 45 + ALNUM.indexOf(text[i + 1]), 11);
    } else {
      bits.put(ALNUM.indexOf(text[i]), 6);
    }
  }
}

function payloadBitLength(text, mode, version) {
  const header = 4 + countBits(mode, version);
  if (mode === 'byte') return header + utf8(text).length * 8;
  if (mode === 'numeric') {
    const full = Math.floor(text.length / 3);
    const rest = text.length % 3;
    return header + full * 10 + (rest === 0 ? 0 : rest * 3 + 1);
  }
  return header + Math.floor(text.length / 2) * 11 + (text.length % 2) * 6;
}

function smallestVersion(text, level, mode = pickMode(text)) {
  for (let v = 1; v <= MAX_VERSION; v++) {
    if (payloadBitLength(text, mode, v) <= dataCapacityBytes(v, level) * 8) return v;
  }
  return null;
}

function fit(text, level) {
  const mode = pickMode(text);
  const order = ['H', 'Q', 'M', 'L'];
  const start = order.indexOf(level);
  for (let i = start; i < order.length; i++) {
    const version = smallestVersion(text, order[i], mode);
    if (version) return { version, level: order[i], mode, relaxed: i !== start };
  }
  return null;
}

function codewords(text, version, level, mode) {
  const capacity = dataCapacityBytes(version, level);
  const bits = new Bits();
  encodeSegment(bits, text, mode, version);
  const limit = capacity * 8;
  for (let i = 0; i < 4 && bits.length < limit; i++) bits.putBit(false);
  while (bits.length % 8 !== 0) bits.putBit(false);
  const data = bits.bytes.slice();
  const pad = [0xec, 0x11];
  for (let i = 0; data.length < capacity; i++) data.push(pad[i % 2]);

  const layout = blockLayout(version, level);
  const dataBlocks = [];
  const ecBlocks = [];
  let offset = 0;
  for (const block of layout) {
    const chunk = data.slice(offset, offset + block.data);
    offset += block.data;
    dataBlocks.push(chunk);
    ecBlocks.push(remainder(chunk, block.ec));
  }

  const out = [];
  const widestData = Math.max(...dataBlocks.map((b) => b.length));
  for (let i = 0; i < widestData; i++) {
    for (const block of dataBlocks) if (i < block.length) out.push(block[i]);
  }
  const widestEc = Math.max(...ecBlocks.map((b) => b.length));
  for (let i = 0; i < widestEc; i++) {
    for (const block of ecBlocks) if (i < block.length) out.push(block[i]);
  }
  return out;
}

const G15 = 0b10100110111;
const G18 = 0b1111100100101;
const G15_MASK = 0b101010000010010;

function bchDigits(value) {
  let digits = 0;
  while (value !== 0) {
    digits++;
    value >>>= 1;
  }
  return digits;
}

function formatInfo(level, mask) {
  const value = (EC_LEVELS[level] << 3) | mask;
  let d = value << 10;
  while (bchDigits(d) - bchDigits(G15) >= 0) d ^= G15 << (bchDigits(d) - bchDigits(G15));
  return ((value << 10) | d) ^ G15_MASK;
}

function versionInfo(version) {
  let d = version << 12;
  while (bchDigits(d) - bchDigits(G18) >= 0) d ^= G18 << (bchDigits(d) - bchDigits(G18));
  return (version << 12) | d;
}

function maskBit(mask, row, col) {
  switch (mask) {
    case 0: return (row + col) % 2 === 0;
    case 1: return row % 2 === 0;
    case 2: return col % 3 === 0;
    case 3: return (row + col) % 3 === 0;
    case 4: return (Math.floor(row / 2) + Math.floor(col / 3)) % 2 === 0;
    case 5: return ((row * col) % 2) + ((row * col) % 3) === 0;
    case 6: return (((row * col) % 2) + ((row * col) % 3)) % 2 === 0;
    default: return (((row * col) % 3) + ((row + col) % 2)) % 2 === 0;
  }
}

function blank(size) {
  return Array.from({ length: size }, () => new Array(size).fill(null));
}

function placeFinder(grid, row, col) {
  const size = grid.length;
  for (let r = -1; r <= 7; r++) {
    for (let c = -1; c <= 7; c++) {
      const rr = row + r;
      const cc = col + c;
      if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
      const ring = Math.max(Math.abs(r - 3), Math.abs(c - 3));
      grid[rr][cc] = ring === 0 || ring === 1 || ring === 3;
    }
  }
}

function placeFunctionPatterns(grid, version) {
  const size = grid.length;
  placeFinder(grid, 0, 0);
  placeFinder(grid, 0, size - 7);
  placeFinder(grid, size - 7, 0);

  for (let i = 8; i < size - 8; i++) {
    const on = i % 2 === 0;
    grid[6][i] = on;
    grid[i][6] = on;
  }

  const centers = ALIGN_CENTERS[version - 1];
  const last = centers[centers.length - 1];
  for (const cy of centers) {
    for (const cx of centers) {
      const onFinder = (cy === 6 && cx === 6) || (cy === 6 && cx === last) || (cy === last && cx === 6);
      if (onFinder) continue;
      for (let r = -2; r <= 2; r++) {
        for (let c = -2; c <= 2; c++) {
          grid[cy + r][cx + c] = Math.max(Math.abs(r), Math.abs(c)) !== 1;
        }
      }
    }
  }

  for (let i = 0; i < 9; i++) {
    if (grid[8][i] === null) grid[8][i] = false;
    if (grid[i][8] === null) grid[i][8] = false;
  }
  for (let i = 0; i < 8; i++) {
    grid[8][size - 1 - i] = false;
    grid[size - 1 - i][8] = false;
  }
  grid[size - 8][8] = true;

  if (version >= 7) {
    for (let i = 0; i < 18; i++) {
      grid[Math.floor(i / 3)][(i % 3) + size - 11] = false;
      grid[(i % 3) + size - 11][Math.floor(i / 3)] = false;
    }
  }
}

function placeTypeInfo(grid, level, mask, version) {
  const size = grid.length;
  const bits = formatInfo(level, mask);
  for (let i = 0; i < 15; i++) {
    const on = ((bits >> i) & 1) === 1;
    if (i < 6) grid[i][8] = on;
    else if (i < 8) grid[i + 1][8] = on;
    else grid[size - 15 + i][8] = on;

    if (i < 8) grid[8][size - i - 1] = on;
    else if (i < 9) grid[8][15 - i] = on;
    else grid[8][14 - i] = on;
  }
  grid[size - 8][8] = true;

  if (version >= 7) {
    const vbits = versionInfo(version);
    for (let i = 0; i < 18; i++) {
      const on = ((vbits >> i) & 1) === 1;
      grid[Math.floor(i / 3)][(i % 3) + size - 11] = on;
      grid[(i % 3) + size - 11][Math.floor(i / 3)] = on;
    }
  }
}

function placeData(grid, bytes, mask) {
  const size = grid.length;
  let inc = -1;
  let row = size - 1;
  let bitIndex = 7;
  let byteIndex = 0;

  for (let col = size - 1; col > 0; col -= 2) {
    if (col === 6) col--;
    for (;;) {
      for (let c = 0; c < 2; c++) {
        if (grid[row][col - c] !== null) continue;
        let on = false;
        if (byteIndex < bytes.length) on = ((bytes[byteIndex] >>> bitIndex) & 1) === 1;
        if (maskBit(mask, row, col - c)) on = !on;
        grid[row][col - c] = on;
        bitIndex--;
        if (bitIndex === -1) {
          byteIndex++;
          bitIndex = 7;
        }
      }
      row += inc;
      if (row < 0 || row >= size) {
        row -= inc;
        inc = -inc;
        break;
      }
    }
  }
}

function runPenalty(line) {
  let score = 0;
  let run = 1;
  for (let i = 1; i < line.length; i++) {
    if (line[i] === line[i - 1]) {
      run++;
    } else {
      if (run >= 5) score += 3 + (run - 5);
      run = 1;
    }
  }
  if (run >= 5) score += 3 + (run - 5);
  return score;
}

const FINDER_RUN = [true, false, true, true, true, false, true];

function hasFinderRun(line, at) {
  for (let i = 0; i < 7; i++) if (line[at + i] !== FINDER_RUN[i]) return false;
  const before = line.slice(Math.max(0, at - 4), at);
  const after = line.slice(at + 7, at + 11);
  const quietBefore = before.length === 4 && before.every((v) => !v);
  const quietAfter = after.length === 4 && after.every((v) => !v);
  return quietBefore || quietAfter;
}

function penalty(grid) {
  const size = grid.length;
  let score = 0;
  let dark = 0;

  for (let i = 0; i < size; i++) {
    const row = grid[i];
    const col = grid.map((r) => r[i]);
    score += runPenalty(row) + runPenalty(col);
    for (let j = 0; j <= size - 7; j++) {
      if (hasFinderRun(row, j)) score += 40;
      if (hasFinderRun(col, j)) score += 40;
    }
    for (const cell of row) if (cell) dark++;
  }

  for (let r = 0; r < size - 1; r++) {
    for (let c = 0; c < size - 1; c++) {
      const v = grid[r][c];
      if (v === grid[r][c + 1] && v === grid[r + 1][c] && v === grid[r + 1][c + 1]) score += 3;
    }
  }

  const ratio = (dark * 100) / (size * size);
  score += Math.floor(Math.abs(ratio - 50) / 5) * 10;
  return score;
}

function encode(text, requestedLevel = 'M') {
  const chosen = fit(text, requestedLevel);
  if (!chosen) {
    const cap = dataCapacityBytes(MAX_VERSION, 'L');
    throw new RangeError(`Payload needs more than version ${MAX_VERSION} (max ${cap} bytes at level L)`);
  }
  const { version, level, mode, relaxed } = chosen;
  const size = version * 4 + 17;
  const bytes = codewords(text, version, level, mode);

  let best = null;
  for (let mask = 0; mask < 8; mask++) {
    const grid = blank(size);
    placeFunctionPatterns(grid, version);
    placeData(grid, bytes, mask);
    placeTypeInfo(grid, level, mask, version);
    const score = penalty(grid);
    if (!best || score < best.score) best = { grid, score, mask };
  }

  return {
    size,
    version,
    level,
    mode,
    mask: best.mask,
    relaxed,
    modules: best.grid,
    isDark: (row, col) => best.grid[row][col] === true,
  };
}

function escapeVcard(value) {
  return String(value)
    .replace(/\\/g, '\\\\')
    .replace(/\n/g, '\\n')
    .replace(/,/g, '\\,')
    .replace(/;/g, '\\;');
}

function escapeWifi(value) {
  return String(value).replace(/([\\;,":])/g, '\\$1');
}

function trimmed(fields) {
  const out = {};
  for (const [key, value] of Object.entries(fields || {})) {
    const text = value == null ? '' : String(value).trim();
    if (text) out[key] = text;
  }
  return out;
}

const SOCIALS = {
  linkedin: { label: 'LinkedIn', base: 'https://www.linkedin.com/in/' },
  instagram: { label: 'Instagram', base: 'https://instagram.com/' },
  github: { label: 'GitHub', base: 'https://github.com/' },
  x: { label: 'X', base: 'https://x.com/' },
};

const SOCIAL_SERVICES = Object.entries(SOCIALS).map(([id, meta]) => ({ id, ...meta }));

function socialUrl(service, value) {
  const text = String(value || '').trim();
  if (!text) return '';
  if (/^https?:\/\//i.test(text)) return text;
  const meta = SOCIALS[service];
  if (!meta) return normalizeUrl(text);
  return meta.base + text.replace(/^@/, '');
}

function normalizeUrl(input) {
  const text = String(input || '').trim();
  if (!text) return '';
  if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return text;
  return `https://${text}`;
}

const BUILDERS = {
  url: (f) => normalizeUrl(f.url),

  text: (f) => String(f.text || ''),

  wifi: (f) => {
    const fields = trimmed(f);
    if (!fields.ssid) return '';
    const security = fields.security || 'WPA';
    const parts = [`T:${security}`, `S:${escapeWifi(fields.ssid)}`];
    if (security !== 'nopass' && fields.password) parts.push(`P:${escapeWifi(fields.password)}`);
    if (fields.hidden === 'true' || fields.hidden === true) parts.push('H:true');
    return `WIFI:${parts.join(';')};;`;
  },

  vcard: (f) => {
    const fields = trimmed(f);
    const first = fields.first || '';
    const last = fields.last || '';
    const full = [first, last].filter(Boolean).join(' ');
    if (!full && !fields.email && !fields.phone) return '';
    const lines = ['BEGIN:VCARD', 'VERSION:3.0'];
    lines.push(`N:${escapeVcard(last)};${escapeVcard(first)};;;`);
    lines.push(`FN:${escapeVcard(full)}`);
    if (fields.org) lines.push(`ORG:${escapeVcard(fields.org)}`);
    if (fields.title) lines.push(`TITLE:${escapeVcard(fields.title)}`);
    if (fields.phone) lines.push(`TEL;TYPE=CELL:${escapeVcard(fields.phone)}`);
    if (fields.email) lines.push(`EMAIL;TYPE=INTERNET:${escapeVcard(fields.email)}`);
    if (fields.url) lines.push(`URL:${escapeVcard(normalizeUrl(fields.url))}`);
    const adr = [fields.street, fields.city, fields.region, fields.postal, fields.country];
    if (adr.some(Boolean)) {
      lines.push(`ADR;TYPE=WORK:;;${adr.map((v) => escapeVcard(v || '')).join(';')}`);
    }
    for (const service of Object.keys(SOCIALS)) {
      const url = socialUrl(service, fields[service]);
      if (url) lines.push(`X-SOCIALPROFILE;TYPE=${service}:${escapeVcard(url)}`);
    }
    if (fields.note) lines.push(`NOTE:${escapeVcard(fields.note)}`);
    lines.push('END:VCARD');
    return lines.join('\r\n');
  },

  mecard: (f) => {
    const fields = trimmed(f);
    const name = [fields.last, fields.first].filter(Boolean).join(',');
    if (!name && !fields.email && !fields.phone) return '';
    const parts = [];
    if (name) parts.push(`N:${escapeWifi(name)}`);
    if (fields.phone) parts.push(`TEL:${escapeWifi(fields.phone)}`);
    if (fields.email) parts.push(`EMAIL:${escapeWifi(fields.email)}`);
    if (fields.org) parts.push(`ORG:${escapeWifi(fields.org)}`);
    if (fields.url) parts.push(`URL:${escapeWifi(normalizeUrl(fields.url))}`);
    if (fields.note) parts.push(`NOTE:${escapeWifi(fields.note)}`);
    return `MECARD:${parts.join(';')};;`;
  },

  email: (f) => {
    const fields = trimmed(f);
    if (!fields.to) return '';
    const query = [];
    if (fields.subject) query.push(`subject=${encodeURIComponent(fields.subject)}`);
    if (fields.body) query.push(`body=${encodeURIComponent(fields.body)}`);
    return `mailto:${fields.to}${query.length ? `?${query.join('&')}` : ''}`;
  },

  phone: (f) => {
    const fields = trimmed(f);
    if (!fields.number) return '';
    const number = fields.number.replace(/[^\d+*#]/g, '');
    if (fields.mode !== 'text') return `tel:${number}`;
    return fields.message ? `sms:${number}?body=${encodeURIComponent(fields.message)}` : `sms:${number}`;
  },

  sms: (f) => {
    const fields = trimmed(f);
    if (!fields.number) return '';
    const number = fields.number.replace(/[^\d+*#]/g, '');
    return fields.message ? `sms:${number}?body=${encodeURIComponent(fields.message)}` : `sms:${number}`;
  },

  geo: (f) => {
    const fields = trimmed(f);
    if (!fields.lat || !fields.lon) return '';
    return `geo:${Number(fields.lat)},${Number(fields.lon)}`;
  },
};

const PAYLOAD_TYPES = Object.keys(BUILDERS);

function buildPayload(type, fields) {
  const builder = BUILDERS[type];
  if (!builder) throw new Error(`unknown payload type: ${type}`);
  return builder(fields || {});
}

function backdropFor(id) {

}

}

}

function channels(hex) {
  const clean = hex.replace('#', '');
  const value = clean.length === 3
    ? clean.split('').map((c) => c + c).join('')
    : clean;
  return [
    parseInt(value.slice(0, 2), 16),
    parseInt(value.slice(2, 4), 16),
    parseInt(value.slice(4, 6), 16),
  ];
}

function toHex([r, g, b]) {
  return `#${[r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('')}`;
}

function mixHex(a, b, amount) {
  const from = channels(a);
  const to = channels(b);
  return toHex(from.map((v, i) => v + (to[i] - v) * amount));
}

function luminance(hex) {
  const [r, g, b] = channels(hex).map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function contrastRatio(a, b) {
  const light = Math.max(luminance(a), luminance(b));
  const dark = Math.min(luminance(a), luminance(b));
  return (light + 0.05) / (dark + 0.05);
}

function onColor(hex) {
  return luminance(hex) > 0.42 ? '#26302C' : '#F3F1E8';
}

function nudgeAway(color, from, target = 1.22) {
  if (contrastRatio(color, from) >= target) return color;
  const away = luminance(color) >= luminance(from) ? '#FFFFFF' : '#232B28';
  for (let step = 1; step <= 12; step++) {
    const shifted = mixHex(color, away, step / 24);
    if (contrastRatio(shifted, from) >= target) return shifted;
  }
  return mixHex(color, away, 0.5);
}

function groundTintFor(palette, ground, custom) {
  if (custom) return custom;
  return nudgeAway(ground.tint, palette.slots.primary);
}

function scanInk(color, background, target = 5) {
  let mixed = color;
  for (let step = 0; step <= 20; step++) {
    mixed = mixHex(color, '#1A211C', step / 20);
    if (contrastRatio(mixed, background) >= target) return mixed;
  }
  return mixed;
}

const dome = (d) => Math.sqrt(Math.max(0, 1 - d * d));

function ring(nx, ny) {
  return Math.hypot(nx, ny);
}

const tree = {
  id: 'tree',
  name: 'Tree',
  reach: 0.32,
  fill: 0.55,
  sample(nx, ny) {
    const d = ring(nx, ny);
    const out = [];
    if (Math.abs(nx) < 0.2 && Math.abs(ny) < 0.2) out.push({ base: 0, top: 0.5, slot: 'secondary', keep: true });
    if (d <= 0.98) {
      const top = 0.42 + 0.5 * dome(d);
      out.push({ base: 0.4, top, slot: 'primary' });
    }
    return out;
  },
  decor(nx, ny) {
    const d = ring(nx, ny);
    if (Math.abs(nx) < 0.2 && Math.abs(ny) < 0.2) return [{ base: 0, top: 0.48, slot: 'secondary', keep: true }];
    if (d > 0.92) return [];
    const top = 0.42 + 0.5 * dome(d);
    if (d > 0.3 && d < 0.72) return [{ base: top, top: top + 0.1, slot: 'accent' }];
    return [{ base: top - 0.14, top, slot: 'primary' }];
  },
};

const TEMPLATES = { tree, pine, flower, mushroom, house, tower, cat, duck, person };

const TEMPLATE_IDS = Object.keys(TEMPLATES);

function templateFor(id) {
  return TEMPLATES[id] || TEMPLATES.tree;
}

const DEFAULT_CONFIG = {
  version: 1,
  type: 'url',
  fields: { url: 'https://github.com' },
  object: 'tree',
  palette: 'seafoam',
  zones: {},
  ground: 'grass',
  tint: null,
  backdrop: 'slate',
  backdropTint: null,
  ecc: 'M',
  seed: 1337,
  overlay: true,
};

const SHORT = {
  version: 'v', type: 't', fields: 'f', object: 'o', palette: 'p',
  zones: 'z', ground: 'g', tint: 'n', ecc: 'e', seed: 's', overlay: 'y',
  backdrop: 'b', backdropTint: 'k',
};

const LONG = Object.fromEntries(Object.entries(SHORT).map(([k, v]) => [v, k]));

function toBase64Url(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromBase64Url(text) {
  const padded = text.replace(/-/g, '+').replace(/_/g, '/');
  const binary = atob(padded + '='.repeat((4 - (padded.length % 4)) % 4));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function encodeConfig(config) {
  const packed = {};
  for (const [key, short] of Object.entries(SHORT)) {
    const value = config[key];
    if (value === undefined || value === null) continue;
    if (key !== 'fields') {
      if (typeof value === 'object' && Object.keys(value).length === 0) continue;
      if (JSON.stringify(value) === JSON.stringify(DEFAULT_CONFIG[key])) continue;
    }
    packed[short] = value;
  }
  packed.v = config.version ?? 1;
  packed.f = config.fields || {};
  return toBase64Url(JSON.stringify(packed));
}

function decodeConfig(encoded) {
  const packed = JSON.parse(fromBase64Url(encoded));
  const config = { ...DEFAULT_CONFIG, fields: {}, zones: {} };
  for (const [short, value] of Object.entries(packed)) {
    const key = LONG[short];
    if (key) config[key] = value;
  }
  return sanitize(config);
}

function isHex(value) {
  return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value);
}

function sanitize(config) {
  const out = { ...DEFAULT_CONFIG, ...config };
  out.fields = { ...(config.fields || {}) };
  out.zones = { ...(config.zones || {}) };
  if (!TEMPLATE_IDS.includes(out.object)) out.object = DEFAULT_CONFIG.object;
  if (!PALETTES[out.palette]) out.palette = DEFAULT_CONFIG.palette;
  if (!GROUNDS[out.ground]) out.ground = DEFAULT_CONFIG.ground;
  if (!BACKDROPS[out.backdrop]) out.backdrop = DEFAULT_CONFIG.backdrop;
  if (!isHex(out.backdropTint)) out.backdropTint = null;
  if (!isHex(out.tint)) out.tint = null;
  for (const [slot, value] of Object.entries(out.zones)) {
    if (!isHex(value)) delete out.zones[slot];
  }
  if (!['L', 'M', 'Q', 'H'].includes(out.ecc)) out.ecc = DEFAULT_CONFIG.ecc;
  out.seed = Number.isFinite(out.seed) ? Math.abs(Math.floor(out.seed)) % 100000 : 1;
  out.overlay = out.overlay !== false;
  return out;
}

function colorsFor(config) {
  const palette = paletteFor(config.palette);
  return { ...palette.slots, ...config.zones };
}

function roll(config, rng = Math.random) {
  const pick = (list) => list[Math.floor(rng() * list.length)];
  const backdrops = Object.keys(BACKDROPS).filter((id) => id !== 'clear');
  return sanitize({
    ...config,
    zones: {},
    tint: null,
    backdropTint: null,
    object: pick(TEMPLATE_IDS),
    palette: pick(Object.keys(PALETTES)),
    ground: pick(Object.keys(GROUNDS)),
    backdrop: pick(backdrops),
    seed: Math.floor(rng() * 100000),
  });
}

function backdropColor(config) {
  if (config.backdropTint) return config.backdropTint;
  return BACKDROPS[config.backdrop] ? BACKDROPS[config.backdrop].color : null;
}

const MIN_COLUMN = 0.4;
const SLAB = 0.55;
const QUIET = 4;

function makeRng(seed) {
  let state = (seed | 0) || 1;
  return () => {
    state = (state * 1103515245 + 12345) & 0x7fffffff;
    return state / 0x7fffffff;
  };
}

function finderRing(size, x, y) {
  const corners = [[0, 0], [size - 7, 0], [0, size - 7]];
  for (const [cx, cy] of corners) {
    if (x >= cx && x < cx + 7 && y >= cy && y < cy + 7) {
      return Math.max(Math.abs(x - cx - 3), Math.abs(y - cy - 3));
    }
  }
  return -1;
}

function isTiming(size, x, y) {
  if (x === 6 && y >= 8 && y < size - 8) return true;
  return y === 6 && x >= 8 && x < size - 8;
}

function buildScene({ code, template: templateId, seed = 1, lift = 1 }) {
  const { size, modules } = code;
  const template = templateFor(templateId);
  const rng = makeRng(seed);

  const diameter = size * template.reach * 2;
  const radius = diameter / 2;
  const cx = size / 2;
  const cy = size * 0.46;
  const unit = 1 / diameter;

  const columns = [];
  const decor = [];
  const tufts = [];

  const localFor = (x, y) => {
    const nx = (x + 0.5 - cx) / radius;
    const ny = (y + 0.5 - cy) / radius;
    return { nx, ny, d: Math.hypot(nx, ny) };
  };

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dark = modules[y][x] === true;
      const { nx, ny, d } = localFor(x, y);
      const ring = finderRing(size, x, y);

      if (!dark) {
        if (d <= 1) {
          const density = template.fill ?? 0.6;
          for (const part of template.decor(nx, ny)) {
            if (part.top - part.base < 0.02) continue;
            if (!part.keep && rng() > density) continue;
            decor.push({
              x, y,
              base: part.base * diameter * lift,
              top: part.top * diameter * lift,
              slot: part.slot,
            });
          }
        } else if (ring < 0 && rng() < 0.1) {
          tufts.push({ x: x + 0.25 + rng() * 0.5, y: y + 0.25 + rng() * 0.5 });
        }
        continue;
      }

      if (ring >= 0) {
        const height = ring <= 1 ? 2.6 : 1.5;
        columns.push({ x, y, base: 0, top: height, slot: 'landmark', kind: 'landmark' });
        continue;
      }

      const apron = MIN_COLUMN + 0.44 * Math.max(0, 1 - Math.max(0, d - 1) / 1.1);

      if (isTiming(size, x, y)) {
        columns.push({ x, y, base: 0, top: MIN_COLUMN, slot: 'scatter', kind: 'path' });
        continue;
      }

      const parts = d <= 1 ? template.sample(nx, ny) : [];
      const usable = parts.filter((p) => (p.top - p.base) * diameter >= MIN_COLUMN);

      if (usable.length === 0) {
        columns.push({ x, y, base: 0, top: apron, slot: 'scatter', kind: 'scatter' });
        continue;
      }

      const grounded = usable.some((p) => p.base * diameter < MIN_COLUMN);
      if (!grounded) {
        columns.push({ x, y, base: 0, top: MIN_COLUMN, slot: 'scatter', kind: 'stub' });
      }
      for (const part of usable) {
        columns.push({
          x, y,
          base: part.base * diameter * lift,
          top: part.top * diameter * lift,
          slot: part.slot,
          kind: 'object',
        });
      }
    }
  }

  return {
    size,
    quiet: QUIET,
    tile: size + QUIET * 2,
    unit,
    center: { x: cx, y: cy },
    radius,
    columns,
    decor,
    tufts,
    peak: columns.reduce((max, c) => Math.max(max, c.top), 0),
  };
}

function footprint(scene) {
  const seen = new Set();
  for (const column of scene.columns) seen.add(`${column.x},${column.y}`);
  return seen;
}

function svgString(code, { ink, ground, size = 1024, radius = 0 } = {}) {
  const tile = code.size + QUIET * 2;
  const paths = [];
  for (let y = 0; y < code.size; y++) {
    let run = 0;
    for (let x = 0; x <= code.size; x++) {
      const dark = x < code.size && code.modules[y][x] === true;
      if (dark) {
        run++;
        continue;
      }
      if (run > 0) {
        paths.push(`M${QUIET + x - run} ${QUIET + y}h${run}v1h${-run}z`);
        run = 0;
      }
    }
  }
  return [
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${tile} ${tile}" shape-rendering="crispEdges">`,
    `<rect width="${tile}" height="${tile}" rx="${radius}" fill="${ground}"/>`,
    `<path fill="${ink}" d="${paths.join('')}"/>`,
    '</svg>',
  ].join('');
}

function drawFlat(canvas, code, { ink, ground, pixels = 1024, margin = true }) {
  const tile = code.size + (margin ? QUIET * 2 : 0);
  const scale = Math.max(1, Math.floor(pixels / tile));
  const edge = tile * scale;
  canvas.width = edge;
  canvas.height = edge;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, edge, edge);
  ctx.fillStyle = ink;
  const offset = margin ? QUIET : 0;
  for (let y = 0; y < code.size; y++) {
    for (let x = 0; x < code.size; x++) {
      if (code.modules[y][x] === true) {
        ctx.fillRect((x + offset) * scale, (y + offset) * scale, scale, scale);
      }
    }
  }
  return canvas;
}

function densityNote(code) {
  const grain = code.size <= 25 ? 'chunky blocks'
    : code.size <= 33 ? 'medium blocks'
      : code.size <= 41 ? 'small blocks'
        : 'fine grain';
  return {
    label: `Version ${code.version}${code.level}, ${code.size} modules, ${grain}`,
    crowded: code.version > 6,
  };
}

function shareBase(location) {
  return `${location.origin}${location.pathname.replace(/[^/]*$/, '')}`;
}

function shareLink(location, packed) {
  return `${location.origin}${location.pathname}#c=${packed}`;
}

function embedSnippet(base, packed, { width = 320, height = 360 } = {}) {
  return [
    `<iframe src="${base}embed.html#c=${packed}"`,
    `  width="${width}" height="${height}" loading="lazy" style="border:0"`,
    '  title="Scan this code"></iframe>',
  ].join('\n');
}

async function writeClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // fall through to the selection fallback
    }
  }

  const holder = document.createElement('textarea');
  holder.value = text;
  holder.setAttribute('readonly', '');
  holder.style.position = 'fixed';
  holder.style.top = '0';
  holder.style.left = '0';
  holder.style.opacity = '0';
  document.body.appendChild(holder);
  holder.select();
  holder.setSelectionRange(0, text.length);

  let copied = false;
  try {
    copied = document.execCommand('copy');
  } catch {
    copied = false;
  }
  holder.remove();
  return copied;
}

function typeFor(id) {
  return CONTENT_TYPES.find((type) => type.id === id) || CONTENT_TYPES[0];
}

function visibleFields(type, fields) {
  const out = [];
  for (const group of type.groups) {
    for (const field of group.fields) {
      if (field.when && !field.when(fields)) continue;
      out.push(field);
    }
  }
  return out;
}

let counter = 0;

function nextId(prefix = 'f') {
  counter += 1;
  return `${prefix}${counter}`;
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function buildControl(field, value, onInput) {
  const id = nextId('c');
  let control;

  if (field.type === 'select') {
    control = document.createElement('select');
    for (const [optionValue, optionLabel] of field.options) {
      const option = element('option', null, optionLabel);
      option.value = optionValue;
      control.appendChild(option);
    }
    control.value = value || field.options[0][0];
  } else if (field.type === 'textarea') {
    control = document.createElement('textarea');
    control.rows = field.rows || 3;
    control.value = value || '';
  } else if (field.type === 'checkbox') {
    control = document.createElement('input');
    control.type = 'checkbox';
    control.checked = value === true || value === 'true';
  } else {
    control = document.createElement('input');
    control.type = field.type === 'password' ? 'password' : field.type;
    control.value = value || '';
    if (field.inputmode) control.inputMode = field.inputmode;
    if (field.spellcheck === false) control.spellcheck = false;
    if (field.type === 'password') control.autocapitalize = 'none';
  }

  control.id = id;
  if (field.placeholder && field.type !== 'checkbox' && field.type !== 'select') {
    control.placeholder = field.placeholder;
  }
  if (field.autocomplete) control.autocomplete = field.autocomplete;

  const read = () => (field.type === 'checkbox' ? control.checked : control.value);
  control.addEventListener('input', () => onInput(read()));
  control.addEventListener('change', () => onInput(read()));

  return { id, control };
}

function buildField(field, value, onInput) {
  const { id, control } = buildControl(field, value, onInput);
  const wrap = element('div', `field field-${field.width || 'full'}`);

  if (field.type === 'checkbox') {
    wrap.classList.add('field-check');
    const label = element('label', 'check-label');
    label.htmlFor = id;
    label.textContent = field.label;
    wrap.append(control, label);
    return wrap;
  }

  const label = element('label', 'field-label', field.label);
  label.htmlFor = id;
  wrap.append(label, control);

  if (field.hint) {
    const hint = element('p', 'field-hint', field.hint);
    hint.id = `${id}-hint`;
    control.setAttribute('aria-describedby', hint.id);
    wrap.appendChild(hint);
  }
  return wrap;
}

function createContentPanel(root, { config, onChange }) {
  let state = config;

  const tabRow = element('div', 'tabs');
  tabRow.setAttribute('role', 'tablist');
  tabRow.setAttribute('aria-label', 'What the code carries');

  const lead = element('p', 'lead');
  const form = element('div', 'form');

  const reveal = document.createElement('details');
  reveal.className = 'reveal';
  const revealSummary = element('summary', null, 'What this encodes');
  const revealText = element('pre', 'reveal-text');
  reveal.append(revealSummary, revealText);

  root.append(tabRow, lead, form, reveal);

  function commit(patch) {
    state = { ...state, ...patch };
    onChange(state);
  }

  function renderTabs() {
    tabRow.textContent = '';
    for (const type of CONTENT_TYPES) {
      const button = element('button', 'tab', type.label);
      button.type = 'button';
      button.setAttribute('role', 'tab');
      const selected = type.id === state.type;
      button.setAttribute('aria-selected', String(selected));
      button.tabIndex = selected ? 0 : -1;
      if (selected) button.classList.add('is-on');
      button.addEventListener('click', () => commit({ type: type.id }));
      button.addEventListener('keydown', (event) => {
        const keys = { ArrowRight: 1, ArrowLeft: -1 };
        if (!(event.key in keys)) return;
        event.preventDefault();
        const index = CONTENT_TYPES.findIndex((t) => t.id === state.type);
        const next = CONTENT_TYPES[(index + keys[event.key] + CONTENT_TYPES.length) % CONTENT_TYPES.length];
        commit({ type: next.id });
        const target = tabRow.querySelector('[aria-selected="true"]');
        if (target) target.focus();
      });
      tabRow.appendChild(button);
    }
  }

  function shapeOf(config) {
    const type = typeFor(config.type);
    const keys = [];
    for (const group of type.groups) {
      for (const field of group.fields) {
        if (field.when && !field.when(config.fields)) continue;
        keys.push(field.key);
      }
    }
    return `${type.id}:${keys.join(',')}`;
  }

  let shape = '';

  function renderForm() {
    const type = typeFor(state.type);
    shape = shapeOf(state);
    lead.textContent = type.lead;
    form.textContent = '';

    for (const group of type.groups) {
      const fields = group.fields.filter((field) => !field.when || field.when(state.fields));
      if (!fields.length) continue;

      const rows = element('div', 'rows');
      for (const field of fields) {
        rows.appendChild(buildField(field, state.fields[field.key], (value) => {
          commit({ fields: { ...state.fields, [field.key]: value } });
        }));
      }

      if (!group.legend) {
        form.appendChild(rows);
        continue;
      }

      if (group.collapsed) {
        const box = document.createElement('details');
        box.className = 'subgroup';
        box.open = fields.some((field) => state.fields[field.key]);
        box.appendChild(element('summary', null, group.legend));
        box.appendChild(rows);
        form.appendChild(box);
        continue;
      }

      const set = document.createElement('fieldset');
      set.className = 'subgroup subgroup-open';
      set.appendChild(element('legend', null, group.legend));
      set.appendChild(rows);
      form.appendChild(set);
    }
  }

  renderTabs();
  renderForm();

  return {
    setState(next, { force = false } = {}) {
      const nextShape = shapeOf(next);
      const structural = force || nextShape !== shape;
      state = next;
      renderTabs();
      if (structural) renderForm();
      else lead.textContent = typeFor(state.type).lead;
    },
    showPayload(text) {
      revealText.textContent = text;
    },
  };
}

function chipRow(colors) {
  const wrap = element('span', 'chips');
  wrap.setAttribute('aria-hidden', 'true');
  for (const color of colors) {
    const chip = element('span', 'chip');
    if (color) chip.style.background = color;
    else chip.classList.add('chip-none');
    wrap.appendChild(chip);
  }
  return wrap;
}

function choiceGroup(legendText, items, activeId, onPick) {
  const set = document.createElement('fieldset');
  set.className = 'choice';
  set.appendChild(element('legend', null, legendText));
  const row = element('div', 'choice-row');
  set.setAttribute('role', 'radiogroup');

  items.forEach((item) => {
    const button = element('button', 'choice-item');
    button.type = 'button';
    button.setAttribute('role', 'radio');
    const on = item.id === activeId;
    button.setAttribute('aria-checked', String(on));
    button.tabIndex = on ? 0 : -1;
    if (on) button.classList.add('is-on');
    button.appendChild(chipRow(item.colors));
    button.appendChild(element('span', 'choice-label', item.label));
    button.addEventListener('click', () => onPick(item.id));
    button.addEventListener('keydown', (event) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
      if (!step) return;
      event.preventDefault();
      const index = items.findIndex((entry) => entry.id === activeId);
      onPick(items[(index + step + items.length) % items.length].id);
      const target = row.querySelector('[aria-checked="true"]');
      if (target) target.focus();
    });
    row.appendChild(button);
  });

  set.appendChild(row);
  return set;
}

function colorWell(labelText, value, onPick) {
  const id = nextId('s');
  const wrap = element('div', 'well');
  const label = element('label', 'well-label', labelText);
  label.htmlFor = id;

  const picker = document.createElement('input');
  picker.type = 'color';
  picker.id = id;
  picker.value = value;

  const hex = document.createElement('input');
  hex.type = 'text';
  hex.className = 'well-hex';
  hex.value = value;
  hex.spellcheck = false;
  hex.setAttribute('aria-label', `${labelText}, hex value`);
  hex.inputMode = 'text';
  hex.maxLength = 7;

  picker.addEventListener('input', () => {
    hex.value = picker.value;
    onPick(picker.value);
  });
  hex.addEventListener('change', () => {
    const text = hex.value.trim().replace(/^#?/, '#');
    if (!/^#[0-9a-f]{6}$/i.test(text)) {
      hex.value = picker.value;
      return;
    }
    picker.value = text;
    onPick(text);
  });

  wrap.append(label, picker, hex);
  return wrap;
}
