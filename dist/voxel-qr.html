const SHADOW_LIGHT = { x: -0.34, z: 0.24 };
const KEY_DIRECTION = { x: 0.55, y: 1, z: -0.4 };
const SHADOW_HEIGHT = 0.06;
const MIN_CASTER = 0.9;

function sweptRect(block, light) {
  const span = block.top - block.base;
  const midway = (block.base + block.top) / 2;
  const width = 1 + Math.abs(light.x) * span;
  const depth = 1 + Math.abs(light.z) * span;
  return {
    x0: block.x + 0.5 + light.x * midway - width / 2,
    y0: block.y + 0.5 + light.z * midway - depth / 2,
    x1: block.x + 0.5 + light.x * midway + width / 2,
    y1: block.y + 0.5 + light.z * midway + depth / 2,
  };
}

function shadowMask(scene, { light = SHADOW_LIGHT } = {}) {
  const low = -scene.quiet + 1;
  const high = scene.size + scene.quiet - 2;
  const marked = new Set();

  const cast = (block) => {
    if (block.top < MIN_CASTER) return;
    const rect = sweptRect(block, light);
    for (let y = Math.round(rect.y0); y <= Math.round(rect.y1) - 1; y++) {
      for (let x = Math.round(rect.x0); x <= Math.round(rect.x1) - 1; x++) {
        if (x < low || y < low || x > high || y > high) continue;
        marked.add(`${x},${y}`);
      }
    }
  };

  for (const block of scene.columns) cast(block);
  for (const block of scene.decor) cast(block);
  return marked;
}

function shadowCells(scene, options) {
  return [...shadowMask(scene, options)].map((key) => {
    const parts = key.split(',');
    return { x: Number(parts[0]), y: Number(parts[1]) };
  });
}

function isShaded(mask, block) {
  return block.top < MIN_CASTER && mask.has(`${block.x},${block.y}`);
}

const TOP_DIR = new THREE.Vector3(0, 1, 0.0001).normalize();
const ISO_UP = new THREE.Vector3(0, 1, 0);
const TOP_UP = new THREE.Vector3(0, 0, -1);

const DEFAULT_VIEW = { azimuth: Math.PI / 4, elevation: 0.52 };
const ELEVATION_RANGE = { min: 0.16, max: 1.32 };

function createStage(container) {
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    preserveDrawingBuffer: true,
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearAlpha(0);
  renderer.domElement.setAttribute('aria-hidden', 'true');
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 500);

  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.copy(new THREE.Vector3(KEY_DIRECTION.x, KEY_DIRECTION.y, KEY_DIRECTION.z).normalize());
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(key, ambient);

  const world = new THREE.Group();
  scene.add(world);

  const view = { ...DEFAULT_VIEW };
  const isoDir = new THREE.Vector3();
  const target = new THREE.Vector3();
  const bounds = new THREE.Box3();
  const corner = new THREE.Vector3();
  const eye = new THREE.Vector3();
  const up = new THREE.Vector3();

  let lastDistance = 120;

  function placeCamera(flip) {
    const distance = Math.max(bounds.max.x - bounds.min.x, 40) * 3;
    lastDistance = distance;
    const cosEl = Math.cos(view.elevation);
    isoDir.set(cosEl * Math.sin(view.azimuth), Math.sin(view.elevation), cosEl * Math.cos(view.azimuth));
    eye.copy(isoDir).lerp(TOP_DIR, flip).normalize().multiplyScalar(distance).add(target);
    up.copy(ISO_UP).lerp(TOP_UP, flip).normalize();
    camera.position.copy(eye);
    camera.up.copy(up);
    camera.lookAt(target);
    camera.updateMatrixWorld(true);

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    let minZ = Infinity;
    let maxZ = -Infinity;
    for (let i = 0; i < 8; i++) {
      corner.set(
        i & 1 ? bounds.max.x : bounds.min.x,
        i & 2 ? bounds.max.y : bounds.min.y,
        i & 4 ? bounds.max.z : bounds.min.z,
      ).applyMatrix4(camera.matrixWorldInverse);
      minX = Math.min(minX, corner.x);
      maxX = Math.max(maxX, corner.x);
      minY = Math.min(minY, corner.y);
      maxY = Math.max(maxY, corner.y);
      minZ = Math.min(minZ, corner.z);
      maxZ = Math.max(maxZ, corner.z);
    }

    const width = container.clientWidth || 1;
    const height = container.clientHeight || 1;
    const aspect = width / height;
    const pad = 1.06;
    let halfW = ((maxX - minX) / 2) * pad;
    let halfH = ((maxY - minY) / 2) * pad;
    if (halfW / halfH > aspect) halfH = halfW / aspect;
    else halfW = halfH * aspect;

    const cx = (maxX + minX) / 2;
    const cy = (maxY + minY) / 2;
    camera.left = cx - halfW;
    camera.right = cx + halfW;
    camera.top = cy + halfH;
    camera.bottom = cy - halfH;
    camera.near = Math.max(0.1, -maxZ - 10);
    camera.far = -minZ + 10;
    camera.updateProjectionMatrix();
  }

  function setBounds(box, focus) {
    bounds.copy(box);
    target.copy(focus);
  }

  function resize() {
    const width = container.clientWidth || 1;
    const height = container.clientHeight || 1;
    renderer.setSize(width, height, false);
  }

  let weatherLight = { key: 1.2, ambient: 0.6, keyColor: '#FFFFFF' };

  function setLighting(flip) {
    key.intensity = weatherLight.key * (1 - flip) + 0.18 * flip;
    ambient.intensity = weatherLight.ambient + (1.02 - weatherLight.ambient) * flip;
    key.color.set(weatherLight.keyColor).lerp(new THREE.Color('#FFFFFF'), flip);
  }

  function setWeather(weather, { fogColor, flip = 0 } = {}) {
    weatherLight = { key: weather.key, ambient: weather.ambient, keyColor: weather.keyColor };
    if (!weather.fog || flip > 0.6) {
      scene.fog = null;
      return;
    }
    const span = bounds.max.x - bounds.min.x || 40;
    const reach = span * (1.6 - weather.fog);
    scene.fog = new THREE.Fog(new THREE.Color(fogColor || '#DCE2DE'), lastDistance - reach, lastDistance + span * 0.9);
  }

  function orbit(deltaAzimuth, deltaElevation) {
    view.azimuth = (view.azimuth + deltaAzimuth) % (Math.PI * 2);
    if (view.azimuth < 0) view.azimuth += Math.PI * 2;
    view.elevation = Math.min(
      ELEVATION_RANGE.max,
      Math.max(ELEVATION_RANGE.min, view.elevation + deltaElevation),
    );
    return { ...view };
  }

  function setView(next) {
    if (Number.isFinite(next.azimuth)) view.azimuth = next.azimuth;
    if (Number.isFinite(next.elevation)) {
      view.elevation = Math.min(ELEVATION_RANGE.max, Math.max(ELEVATION_RANGE.min, next.elevation));
    }
  }

  function setBackdrop(color) {
    if (color) renderer.setClearColor(new THREE.Color(color), 1);
    else renderer.setClearAlpha(0);
  }

  return {
    renderer,
    scene,
    camera,
    world,
    setBounds,
    placeCamera,
    setLighting,
    setBackdrop,
    setWeather,
    orbit,
    setView,
    get view() {
      return { ...view };
    },
    resize,
    render: () => renderer.render(scene, camera),
    projectPoint: (point) => point.clone().project(camera),
    dispose() {
      renderer.dispose();
      renderer.domElement.remove();
    },
  };
}

function createGround(scene, { tile, depth = 1.6 }) {
  const top = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const side = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const under = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const box = new THREE.BoxGeometry(tile, depth, tile);
  const slab = new THREE.Mesh(box, [side, side, top, under, side, side]);
  slab.position.set(0, -depth / 2, 0);
  scene.add(slab);

  const patternTexture = new THREE.CanvasTexture(document.createElement('canvas'));
  patternTexture.colorSpace = THREE.SRGBColorSpace;
  const patternMaterial = new THREE.MeshBasicMaterial({
    map: patternTexture,
    transparent: true,
    depthWrite: false,
  });
  const pattern = new THREE.Mesh(new THREE.PlaneGeometry(tile, tile), patternMaterial);
  pattern.rotation.x = -Math.PI / 2;
  pattern.position.y = 0.02;
  scene.add(pattern);

  return {
    slab,
    pattern,
    setPatternCanvas(canvas) {
      patternTexture.image = canvas;
      patternTexture.needsUpdate = true;
    },
    setColors(tint, edge, flip) {
      top.color.set(tint).lerp(new THREE.Color(SCAN_GROUND), flip);
      side.color.set(edge).lerp(new THREE.Color(SCAN_GROUND), flip * 0.4);
      under.color.set(edge).lerp(new THREE.Color(SCAN_GROUND), flip * 0.4);
      patternMaterial.opacity = Math.max(0, 1 - flip * 2.2);
      pattern.visible = patternMaterial.opacity > 0.01;
    },
    dispose() {
      box.dispose();
      pattern.geometry.dispose();
      [top, side, under, patternMaterial].forEach((m) => m.dispose());
      patternTexture.dispose();
      scene.remove(slab, pattern);
    },
  };
}

function createClouds(scene, { tile }) {
  const group = new THREE.Group();
  const material = new THREE.MeshBasicMaterial({ color: 0xfdfdfb, transparent: true, opacity: 0.9 });
  const puffs = [
    { x: -tile * 0.34, y: tile * 0.42, z: -tile * 0.3, scale: tile * 0.15 },
    { x: tile * 0.36, y: tile * 0.5, z: tile * 0.24, scale: tile * 0.11 },
  ];
  for (const puff of puffs) {
    const cloud = new THREE.Group();
    for (const [dx, dy, dz, s] of [[0, 0, 0, 1], [0.7, -0.18, 0.1, 0.7], [-0.65, -0.12, -0.1, 0.6]]) {
      const block = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 1.2), material);
      block.position.set(dx * puff.scale, dy * puff.scale, dz * puff.scale);
      block.scale.setScalar(s * puff.scale);
      cloud.add(block);
    }
    cloud.position.set(puff.x, puff.y, puff.z);
    cloud.userData.drift = puff.x;
    group.add(cloud);
  }
  scene.add(group);

  return {
    group,
    update(time, flip) {
      material.opacity = Math.max(0, 0.9 - flip * 2);
      group.visible = material.opacity > 0.02;
      group.children.forEach((cloud, index) => {
        cloud.position.x = cloud.userData.drift + Math.sin(time * 0.12 + index * 2.1) * tile * 0.06;
      });
    },
    dispose() {
      group.children.forEach((cloud) => cloud.children.forEach((b) => b.geometry.dispose()));
      material.dispose();
      scene.remove(group);
    },
  };
}

const dummy = new THREE.Object3D();
const tint = new THREE.Color();
const inkColor = new THREE.Color();

function clamp01(value) {
  return value < 0 ? 0 : value > 1 ? 1 : value;
}

function createField(scene, blocks, { colors, ink, tile, quiet, kind, shadowMask, shade, weather }) {
  const count = blocks.length;
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshLambertMaterial();
  const mesh = new THREE.InstancedMesh(geometry, material, Math.max(1, count));
  mesh.count = count;
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const offset = quiet + 0.5 - tile / 2;
  const base = new Float32Array(count);
  const top = new Float32Array(count);
  const delay = new Float32Array(count);
  const phase = new Float32Array(count);
  const slotIndex = new Array(count);
  const isObject = new Uint8Array(count);

  let maxDelay = 0;
  blocks.forEach((block, i) => {
    base[i] = block.base;
    top[i] = block.top;
    slotIndex[i] = block.slot;
    isObject[i] = kind === 'decor' || block.kind === 'object' ? 1 : 0;
    phase[i] = (block.x * 0.7 + block.y * 1.3) % (Math.PI * 2);
  });

  function setRipple(originX, originY) {
    maxDelay = 0;
    blocks.forEach((block, i) => {
      const distance = Math.hypot(block.x - originX, block.y - originY);
      delay[i] = distance / (tile * 1.7);
      maxDelay = Math.max(maxDelay, delay[i]);
    });
  }
  setRipple(blocks.length ? blocks[0].x : 0, blocks.length ? blocks[0].y : 0);

  const shaded = new Uint8Array(count);
  if (shadowMask) {
    blocks.forEach((block, i) => {
      shaded[i] = kind === 'columns' && isShaded(shadowMask, block) ? 1 : 0;
    });
  }
  const shadeColor = new THREE.Color(shade || '#2f3a2c');
  const shadeStrength = weather ? weather.shadow : 1;
  const weatherTint = weather && weather.tint ? new THREE.Color(weather.tint) : null;
  const weatherAmount = weather ? weather.tintAmount : 0;

  function applyColors(mix) {
    inkColor.set(ink);
    for (let i = 0; i < count; i++) {
      tint.set(colors[slotIndex[i]] || '#cccccc');
      if (weatherTint && weatherAmount > 0) tint.lerp(weatherTint, weatherAmount * (1 - mix));
      if (shaded[i]) tint.lerp(shadeColor, 0.3 * shadeStrength * (1 - mix));
      if (mix > 0) tint.lerp(inkColor, mix);
      mesh.setColorAt(i, tint);
    }
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  }

  function writeMatrices({ flip, gap, bob, time }) {
    const spread = 1 + maxDelay;
    for (let i = 0; i < count; i++) {
      const local = clamp01(flip * spread - delay[i]);
      const lift = isObject[i] && bob > 0 ? Math.sin(time * 1.6 + phase[i]) * bob : 0;
      const blockBase = base[i] * (1 - local);
      const blockTop = top[i] + (SLAB - top[i]) * local;
      const height = Math.max(0.02, blockTop - blockBase);
      const inset = gap * (1 - local);
      dummy.position.set(
        blocks[i].x + offset,
        blockBase + height / 2 + lift,
        blocks[i].y + offset,
      );
      dummy.scale.set(1 - inset * 2, height, 1 - inset * 2);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }

  function writeExit({ progress, gap, time }) {
    for (let i = 0; i < count; i++) {
      const local = clamp01(progress * (1 + maxDelay) - delay[i]);
      const shrink = 1 - local;
      const height = Math.max(0.001, (top[i] - base[i]) * shrink);
      const hop = Math.sin(local * Math.PI) * 1.6;
      const lift = Math.sin(time * 1.6 + phase[i]) * (shrink * 0.06);
      dummy.position.set(
        blocks[i].x + offset,
        base[i] + height / 2 + hop + lift,
        blocks[i].y + offset,
      );
      dummy.scale.set(Math.max(0.001, (1 - gap * 2) * shrink), height, Math.max(0.001, (1 - gap * 2) * shrink));
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.visible = progress < 0.995;
  }

  applyColors(0);

  return {
    mesh,
    count,
    applyColors,
    writeMatrices,
    writeExit,
    setRipple,
    dispose() {
      geometry.dispose();
      material.dispose();
      mesh.dispose();
      scene.remove(mesh);
    },
  };
}

function createShadowField(scene, cells, { tile, quiet, color }) {
  const geometry = new THREE.PlaneGeometry(1, 1);
  geometry.rotateX(-Math.PI / 2);
  const material = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.InstancedMesh(geometry, material, Math.max(1, cells.length));
  mesh.count = cells.length;
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.renderOrder = 1;
  scene.add(mesh);

  const offset = quiet + 0.5 - tile / 2;

  function write(fade) {
    const scale = Math.max(0.001, 1 - fade);
    for (let i = 0; i < cells.length; i++) {
      dummy.position.set(cells[i].x + offset, SHADOW_HEIGHT, cells[i].y + offset);
      dummy.scale.set(scale, 1, scale);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.visible = fade < 0.98;
  }

  write(0);

  return {
    mesh,
    write,
    setColor(next) {
      material.color.set(next);
    },
    dispose() {
      geometry.dispose();
      material.dispose();
      mesh.dispose();
      scene.remove(mesh);
    },
  };
}

function contentBounds(tile, peak) {
  const half = tile / 2;
  return new THREE.Box3(
    new THREE.Vector3(-half, -1.6, -half),
    new THREE.Vector3(half, Math.max(peak, tile * 0.3), half),
  );
}

const EASE = {
  inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2),
  out: (t) => 1 - (1 - t) ** 2,
  backIn: (t) => t * t * (2.4 * t - 1.4),
};

const TRACKS = [
  { key: 'decor', start: 0, end: 0.3, ease: 'backIn' },
  { key: 'camera', start: 0.08, end: 0.95, ease: 'inOut' },
  { key: 'flatten', start: 0.12, end: 0.86, ease: 'inOut' },
  { key: 'ink', start: 0.18, end: 0.82, ease: 'inOut' },
  { key: 'light', start: 0.18, end: 0.82, ease: 'inOut' },
  { key: 'overlay', start: 0.88, end: 1, ease: 'out' },
];

const DURATION = 0.95;

function createFlip(state, onUpdate, { reducedMotion = false } = {}) {
  const gsap = typeof window !== 'undefined' ? window.gsap : null;

  function applyProgress(progress) {
    for (const track of TRACKS) {
      const span = track.end - track.start;
      const local = span <= 0 ? 1 : (progress - track.start) / span;
      state[track.key] = EASE[track.ease](local < 0 ? 0 : local > 1 ? 1 : local);
    }
    state.progress = progress;
    onUpdate();
  }

  if (reducedMotion) {
    let open = false;
    return {
      open() {
        open = true;
        applyProgress(1);
      },
      close() {
        open = false;
        applyProgress(0);
      },
      toggle() {
        return open ? this.close() : this.open();
      },
      get isOpen() {
        return open;
      },
      jump: applyProgress,
    };
  }

  if (gsap) {
    const driver = { progress: 0 };
    const tween = gsap.to(driver, {
      progress: 1,
      duration: DURATION,
      ease: 'none',
      paused: true,
      onUpdate: () => applyProgress(driver.progress),
    });
    return {
      open: () => tween.play(),
      close: () => tween.reverse(),
      toggle() {
        return tween.progress() > 0.5 ? tween.reverse() : tween.play();
      },
      get isOpen() {
        return tween.progress() > 0.5;
      },
      jump(progress) {
        tween.progress(progress);
      },
    };
  }

  let progress = 0;
  let direction = 0;
  let last = 0;
  let frame = null;

  function step(now) {
    const delta = Math.min(0.05, (now - last) / 1000);
    last = now;
    progress = Math.max(0, Math.min(1, progress + direction * (delta / DURATION)));
    applyProgress(progress);
    if ((direction > 0 && progress < 1) || (direction < 0 && progress > 0)) {
      frame = requestAnimationFrame(step);
    } else {
      frame = null;
    }
  }

  function run(next) {
    direction = next;
    if (frame === null) {
      last = performance.now();
      frame = requestAnimationFrame(step);
    }
  }

  return {
    open: () => run(1),
    close: () => run(-1),
    toggle() {
      return progress > 0.5 ? run(-1) : run(1);
    },
    get isOpen() {
      return progress > 0.5;
    },
    jump(next) {
      progress = next;
      applyProgress(next);
    },
  };
}

const flake = new THREE.Object3D();

function createWeatherField(scene, weather, { tile, seed }) {
  const spec = weather.particles;
  if (!spec) {
    return {
      update() {},
      dispose() {},
    };
  }

  const rain = spec.kind === 'rain';
  const count = spec.count;
  const ceiling = tile * 0.95;
  const rng = makeRng(seed + 4507);

  const geometry = rain
    ? new THREE.BoxGeometry(0.09, 1.1, 0.09)
    : new THREE.BoxGeometry(0.26, 0.26, 0.26);
  const material = new THREE.MeshBasicMaterial({
    color: spec.color,
    transparent: true,
    opacity: rain ? 0.55 : 0.9,
    depthWrite: false,
  });
  const mesh = new THREE.InstancedMesh(geometry, material, count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const baseX = new Float32Array(count);
  const baseZ = new Float32Array(count);
  const drop = new Float32Array(count);
  const speed = new Float32Array(count);
  const phase = new Float32Array(count);
  const size = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    baseX[i] = (rng() - 0.5) * tile * 1.05;
    baseZ[i] = (rng() - 0.5) * tile * 1.05;
    drop[i] = rng() * ceiling;
    speed[i] = rain ? 26 + rng() * 16 : 2.2 + rng() * 1.8;
    phase[i] = rng() * Math.PI * 2;
    size[i] = 0.7 + rng() * 0.6;
  }

  const slant = rain ? 0.16 : 0;
  const sway = rain ? 0.25 : 1.5;
  const baseOpacity = material.opacity;

  function update(time, fade) {
    material.opacity = baseOpacity * Math.max(0, 1 - fade * 1.6);
    mesh.visible = material.opacity > 0.02;
    if (!mesh.visible) return;

    for (let i = 0; i < count; i++) {
      const fall = (drop[i] + time * speed[i]) % ceiling;
      const y = ceiling - fall;
      const wobble = Math.sin(time * (rain ? 3 : 0.7) + phase[i]) * sway;
      flake.position.set(
        baseX[i] + wobble + (ceiling - y) * slant,
        y,
        baseZ[i] + Math.cos(time * 0.6 + phase[i]) * sway * 0.6,
      );
      flake.rotation.set(0, rain ? 0 : phase[i] + time * 0.4, rain ? -0.14 : phase[i]);
      flake.scale.setScalar(size[i]);
      flake.updateMatrix();
      mesh.setMatrixAt(i, flake.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }

  update(0, 0);

  return {
    mesh,
    update,
    dispose() {
      geometry.dispose();
      material.dispose();
      mesh.dispose();
      scene.remove(mesh);
    },
  };
}

function composeScene(config, code) {
  const scene = buildScene({ code, template: config.object, seed: config.seed });
  const palette = paletteFor(config.palette);
  const weather = weatherFor(config.weather);
  const ground = sceneGround(palette, groundFor(config.ground), config.tint, weather);
  const colors = colorsFor(config);
  const mask = shadowMask(scene);

  return {
    scene,
    palette,
    weather,
    ground,
    colors,
    mask,
    cells: shadowCells(scene),
    shade: shadeFor(ground.tint, weather.shadow),
    shadeInk: SHADE_INK,
    backdrop: backdropColor(config),
    view: { azimuth: config.azimuth, elevation: config.elevation },
  };
}

const SIZE = 768;

function groundPattern(scene, ground, seed) {
  const canvas = document.createElement('canvas');
  canvas.width = SIZE;
  canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const rng = makeRng(seed + 991);
  const tile = scene.tile;
  const unit = SIZE / tile;
  const toPixel = (value) => (value + scene.quiet) * unit;

  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = ground.tint;
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = ground.detailColor;
  ctx.strokeStyle = ground.detailColor;

  if (ground.detail === 'check') {
    const step = unit * 4;
    for (let y = 0; y < SIZE; y += step) {
      for (let x = 0; x < SIZE; x += step) {
        if (((x / step) + (y / step)) % 2 < 1) ctx.fillRect(x, y, step, step);
      }
    }
  }

  if (ground.detail === 'planks') {
    ctx.lineWidth = Math.max(1, unit * 0.12);
    for (let y = unit * 2.5; y < SIZE; y += unit * 2.5) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(SIZE, y);
      ctx.stroke();
    }
    for (let i = 0; i < 40; i++) {
      const x = rng() * SIZE;
      const y = Math.floor((rng() * SIZE) / (unit * 2.5)) * unit * 2.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + unit * 2.5);
      ctx.stroke();
    }
  }

  if (ground.detail === 'ripples') {
    ctx.lineWidth = Math.max(1, unit * 0.18);
    for (let i = 0; i < 90; i++) {
      const x = rng() * SIZE;
      const y = rng() * SIZE;
      const width = unit * (1.2 + rng() * 2.4);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + width / 2, y - unit * 0.5, x + width, y);
      ctx.stroke();
    }
  }

  if (ground.detail === 'speckle') {
    for (let i = 0; i < 900; i++) {
      const radius = unit * (0.06 + rng() * 0.16);
      ctx.beginPath();
      ctx.arc(rng() * SIZE, rng() * SIZE, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (ground.detail === 'tufts') {
    for (const tuft of scene.tufts) {
      const x = toPixel(tuft.x);
      const y = toPixel(tuft.y);
      ctx.lineWidth = Math.max(1, unit * 0.16);
      for (const lean of [-0.35, 0, 0.35]) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + lean * unit, y - unit * 0.8);
        ctx.stroke();
      }
    }
    for (let i = 0; i < 260; i++) {
      ctx.beginPath();
      ctx.arc(rng() * SIZE, rng() * SIZE, unit * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  return canvas;
}

const BOB = 0.09;

function createDiorama(container, { overlay, onState, onView, interactive = true } = {}) {
  const stage = createStage(container);
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const state = { decor: 0, camera: 0, flatten: 0, ink: 0, light: 0, overlay: 0, progress: 0 };
  const corner = new THREE.Vector3();

  let current = null;
  let running = true;
  let dirty = true;
  let start = performance.now();

  const flip = createFlip(state, () => {
    dirty = true;
    if (onState) onState(state);
  }, { reducedMotion });

  function clear() {
    if (!current) return;
    current.columns.dispose();
    current.decor.dispose();
    current.shadows.dispose();
    current.ground.dispose();
    current.clouds.dispose();
    current.weatherField.dispose();
    current = null;
  }

  function build(config, code) {
    clear();
    const composed = composeScene(config, code);
    const { scene, palette, weather, ground, colors, mask, cells, shade, backdrop } = composed;
    const shared = {
      colors,
      ink: palette.ink,
      tile: scene.tile,
      quiet: scene.quiet,
      shadowMask: mask,
      shade: composed.shadeInk,
      weather,
    };

    const groundParts = createGround(stage.world, { tile: scene.tile });
    groundParts.setPatternCanvas(groundPattern(scene, ground, config.seed));

    current = {
      config,
      code,
      scene,
      palette,
      backdrop,
      colors,
      groundTheme: ground,
      ground: groundParts,
      columns: createField(stage.world, scene.columns, { ...shared, kind: 'columns' }),
      decor: createField(stage.world, scene.decor, { ...shared, kind: 'decor' }),
      shadows: createShadowField(stage.world, cells, {
        tile: scene.tile,
        quiet: scene.quiet,
        color: shade,
      }),
      clouds: createClouds(stage.world, { tile: scene.tile }),
      weather,
      weatherField: createWeatherField(stage.world, weather, { tile: scene.tile, seed: config.seed }),
    };
    stage.setBackdrop(backdrop);
    stage.setView(composed.view);
    stage.setWeather(weather, { fogColor: backdrop || '#DCE2DE' });

    stage.setBounds(contentBounds(scene.tile, scene.peak), new THREE.Vector3(0, scene.peak * 0.22, 0));
    setRippleOrigin(scene.size / 2, scene.size / 2);

    if (overlay) {
      drawFlat(overlay, code, { ink: palette.ink, ground: SCAN_GROUND, pixels: 720, margin: false });
      overlay.style.opacity = '0';
    }

    dirty = true;
    return scene;
  }

  function setRippleOrigin(x, y) {
    if (!current) return;
    current.columns.setRipple(x, y);
    current.decor.setRipple(x, y);
  }

  function positionOverlay() {
    if (!overlay || !current) return;
    const { scene } = current;
    const half = scene.tile / 2;
    const edge = half - scene.quiet;
    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    for (const [x, z] of [[-edge, -edge], [edge, -edge], [edge, edge], [-edge, edge]]) {
      corner.set(x, 0, z);
      const projected = stage.projectPoint(corner);
      const px = (projected.x * 0.5 + 0.5) * container.clientWidth;
      const py = (-projected.y * 0.5 + 0.5) * container.clientHeight;
      minX = Math.min(minX, px);
      maxX = Math.max(maxX, px);
      minY = Math.min(minY, py);
      maxY = Math.max(maxY, py);
    }
    overlay.style.left = `${minX}px`;
    overlay.style.top = `${minY}px`;
    overlay.style.width = `${maxX - minX}px`;
    overlay.style.height = `${maxY - minY}px`;
  }

  function frame() {
    if (!running) return;
    requestAnimationFrame(frame);
    if (!current) return;

    const time = (performance.now() - start) / 1000;
    const idle = state.progress < 0.001;
    if (!dirty && !idle) return;

    const bob = idle && !reducedMotion ? BOB : 0;
    current.columns.writeMatrices({ flip: state.flatten, gap: 0.05, bob, time });
    current.decor.writeExit({ progress: state.decor, gap: 0.06, time });
    current.shadows.write(Math.min(1, state.flatten * 1.5));
    current.columns.applyColors(state.ink);
    current.decor.applyColors(0);
    current.ground.setColors(current.groundTheme.tint, current.groundTheme.edge, state.ink);
    current.clouds.update(time, Math.max(state.decor, current.weather.fog));
    current.weatherField.update(time, state.flatten);
    stage.setWeather(current.weather, {
      fogColor: current.backdrop || '#DCE2DE',
      flip: state.flatten,
    });
    stage.setLighting(state.light);
    stage.placeCamera(state.camera);
    stage.render();

    if (overlay) {
      const showing = current.config.overlay !== false && state.overlay > 0.01;
      overlay.style.opacity = showing ? String(state.overlay) : '0';
      if (showing) positionOverlay();
    }

    dirty = idle ? true : state.progress > 0.001 && state.progress < 0.999;
  }

  function resize() {
    stage.resize();
    dirty = true;
  }

  window.addEventListener('resize', resize);
  const visibility = () => {
    running = !document.hidden;
    if (running) {
      start = performance.now();
      requestAnimationFrame(frame);
    }
  };
  document.addEventListener('visibilitychange', visibility);

  const DRAG_SLOP = 8;
  const TURN_PER_PIXEL = 0.0085;
  const TILT_PER_PIXEL = 0.005;

  function originFromPoint(clientX, clientY) {
    if (!current) return;
    const rect = stage.renderer.domElement.getBoundingClientRect();
    const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
    const ny = ((clientY - rect.top) / rect.height) * 2 - 1;
    const size = current.scene.size;
    setRippleOrigin((nx * 0.5 + 0.5) * size, (ny * 0.5 + 0.5) * size);
  }

  if (interactive) {
    let pointer = null;

    container.addEventListener('pointerdown', (event) => {
      if (!event.isPrimary) return;
      pointer = {
        id: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        lastX: event.clientX,
        lastY: event.clientY,
        dragging: false,
      };
      container.setPointerCapture(event.pointerId);
    });

    container.addEventListener('pointermove', (event) => {
      if (!pointer || event.pointerId !== pointer.id) return;
      const totalX = event.clientX - pointer.startX;
      const totalY = event.clientY - pointer.startY;
      if (!pointer.dragging && Math.hypot(totalX, totalY) < DRAG_SLOP) return;

      if (!pointer.dragging) {
        pointer.dragging = true;
        container.classList.add('is-turning');
      }
      const stepX = event.clientX - pointer.lastX;
      const stepY = event.clientY - pointer.lastY;
      pointer.lastX = event.clientX;
      pointer.lastY = event.clientY;

      const next = stage.orbit(-stepX * TURN_PER_PIXEL, stepY * TILT_PER_PIXEL);
      dirty = true;
      if (onView) onView(next);
    });

    const release = (event) => {
      if (!pointer || event.pointerId !== pointer.id) return;
      const wasDragging = pointer.dragging;
      const { startX, startY } = pointer;
      pointer = null;
      container.classList.remove('is-turning');
      if (container.hasPointerCapture(event.pointerId)) {
        container.releasePointerCapture(event.pointerId);
      }
      if (wasDragging || event.type === 'pointercancel') return;
      originFromPoint(startX, startY);
      flip.toggle();
    };

    container.addEventListener('pointerup', release);
    container.addEventListener('pointercancel', release);

    container.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        flip.toggle();
        return;
      }
      const turn = { ArrowLeft: 1, ArrowRight: -1 }[event.key];
      const tilt = { ArrowUp: -1, ArrowDown: 1 }[event.key];
      if (!turn && !tilt) return;
      event.preventDefault();
      const next = stage.orbit((turn || 0) * 0.12, (tilt || 0) * 0.08);
      dirty = true;
      if (onView) onView(next);
    });
  }

  resize();
  requestAnimationFrame(frame);

  return {
    build,
    flip,
    state,
    resize,
    get scene() {
      return current ? current.scene : null;
    },
    resetView() {
      stage.setView(DEFAULT_VIEW);
      dirty = true;
      if (onView) onView(stage.view);
    },
    lockOpen() {
      flip.open();
    },
    unlock() {
      flip.close();
    },
    captureScene(scale = 2) {
      if (!current) return null;
      const element = stage.renderer.domElement;
      const previous = stage.renderer.getPixelRatio();
      stage.renderer.setPixelRatio(Math.min(4, previous * scale));
      stage.resize();
      stage.placeCamera(state.camera);
      stage.render();
      const data = element.toDataURL('image/png');
      stage.renderer.setPixelRatio(previous);
      stage.resize();
      dirty = true;
      return data;
    },
    destroy() {
      running = false;
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', visibility);
      clear();
      stage.dispose();
    },
  };
}

const stageHost = document.querySelector('#stage');
const overlay = document.querySelector('#overlay');
const hint = document.querySelector('#hint');
const toast = document.querySelector('#toast');
const toggle = document.querySelector('#toggle');

const dialogs = {
  content: document.querySelector('#content-dialog'),
  look: document.querySelector('#look-dialog'),
  share: document.querySelector('#share-dialog'),
};

const openers = {
  content: document.querySelector('#content-open'),
  look: document.querySelector('#look-open'),
  share: document.querySelector('#share-open'),
};

const scratch = document.createElement('canvas');

let config = readConfigFromLocation();
let code = null;
let diorama = null;
let content = null;
let look = null;
let share = null;
let flatFallback = null;

function readConfigFromLocation() {
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const packed = params.get('c');
  if (!packed) {
    return sanitize({
      ...DEFAULT_CONFIG,
      fields: { url: `${window.location.origin}${window.location.pathname}` },
    });
  }
  try {
    return decodeConfig(packed);
  } catch {
    return sanitize(DEFAULT_CONFIG);
  }
}

function encodeCurrent() {
  const text = buildPayload(config.type, config.fields) || 'https://github.com';
  try {
    return { code: encode(text, config.ecc), text, trimmed: false };
  } catch {
    let kept = text;
    while (kept.length > 8) {
      kept = kept.slice(0, Math.floor(kept.length * 0.9));
      try {
        return { code: encode(kept, 'L'), text: kept, trimmed: true };
      } catch {
        continue;
      }
    }
    return { code: encode('https://github.com', 'L'), text: '', trimmed: true };
  }
}

function paintBackdrop() {
  const color = backdropColor(config);
  const root = document.documentElement.style;
  const shown = color || '#f1efe9';
  const on = onColor(shown);
  root.setProperty('--backdrop', shown);
  root.setProperty('--on-backdrop', on);
  root.setProperty('--on-backdrop-soft', on === '#26302C' ? '#5c6862' : '#b7c1ba');
}

let hashTimer = 0;
function writeHash(packed) {
  window.clearTimeout(hashTimer);
  hashTimer = window.setTimeout(() => {
    window.history.replaceState(null, '', `#c=${packed}`);
  }, 350);
}

function refresh() {
  const result = encodeCurrent();
  code = result.code;
  paintBackdrop();
  if (diorama) diorama.build(config, code);
  if (flatFallback) refreshFlatFallback(flatFallback);
  if (content) content.showPayload(result.text || '(nothing yet)');

  const note = densityNote(code);
  const warnings = [];
  if (code.relaxed) warnings.push(`Error correction eased to ${code.level} to fit.`);
  if (result.trimmed) warnings.push('That is too long for one code. Shorten it, or link out instead.');
  else if (note.crowded) warnings.push('Blocks are getting small. A shorter payload keeps them chunky.');
  if (share) share.renderMeter(note.label, warnings.join(' '));

  const packed = encodeConfig(config);
  writeHash(packed);
  return packed;
}

function apply(next, options) {
  config = sanitize({ ...next, azimuth: config.azimuth, elevation: config.elevation });
  if (content) content.setState(config, options);
  if (look) look.setState(config);
  refresh();
}

function storeView(view) {
  config = { ...config, azimuth: Number(view.azimuth.toFixed(3)), elevation: Number(view.elevation.toFixed(3)) };
  writeHash(encodeConfig(config));
}

function download(name, href) {
  const link = document.createElement('a');
  link.href = href;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
}

function announce(message) {
  toast.textContent = message;
  toast.classList.add('is-on');
  window.clearTimeout(announce.timer);
  announce.timer = window.setTimeout(() => {
    toast.classList.remove('is-on');
    toast.textContent = '';
  }, 5000);
}

async function copy(text, label) {
  const copied = await writeClipboard(text);
  announce(copied ? `${label} copied to the clipboard.` : `Copying was blocked. ${label} is selected below.`);
  share.showShare(label, text, async (again) => {
    const retried = await writeClipboard(again);
    announce(retried ? `${label} copied to the clipboard.` : 'Copying is blocked here. Select the text and copy it.');
  });
}

function handleShareAction(action) {
  const packed = encodeConfig(config);
  const palette = paletteFor(config.palette);

  if (action === 'qr-png') {
    drawFlat(scratch, code, { ink: palette.ink, ground: '#ffffff', pixels: 1024 });
    download('voxel-qr-code.png', scratch.toDataURL('image/png'));
    announce('Saved the flat code as PNG.');
    return;
  }
  if (action === 'qr-svg') {
    const svg = svgString(code, { ink: palette.ink, ground: '#ffffff' });
    download('voxel-qr-code.svg', `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`);
    announce('Saved the flat code as SVG.');
    return;
  }
  if (action === 'scene-png') {
    const data = diorama && diorama.captureScene(2);
    if (!data) {
      announce('The 3D view is not available, so the scene cannot be saved.');
      return;
    }
    download('voxel-qr-scene.png', data);
    announce('Saved the diorama as PNG.');
    return;
  }
  if (action === 'link') {
    copy(viewLink(shareBase(window.location), packed), 'Link');
    return;
  }
  if (action === 'embed') {
    copy(embedSnippet(shareBase(window.location), packed), 'Embed code');
    return;
  }
  if (action === 'present') {
    dialogs.share.close();
    present();
  }
}

function present() {
  if (!diorama) return;
  document.body.classList.add('is-presenting');
  diorama.resize();
  diorama.lockOpen();
  const wakeLock = navigator.wakeLock ? navigator.wakeLock.request('screen').catch(() => null) : null;
  const exit = (event) => {
    if (event.type === 'keydown' && event.key !== 'Escape') return;
    document.body.classList.remove('is-presenting');
    diorama.unlock();
    diorama.resize();
    window.removeEventListener('keydown', exit);
    window.removeEventListener('click', exit);
    if (wakeLock) wakeLock.then((lock) => lock && lock.release()).catch(() => {});
    toggle.focus();
  };
  window.addEventListener('keydown', exit);
  window.setTimeout(() => window.addEventListener('click', exit, { once: true }), 400);
}

function openDialog(name) {
  const dialog = dialogs[name];
  if (!dialog || dialog.open) return;
  if (name === 'look' && look) look.openAt(null);
  dialog.showModal();
}

for (const [name, button] of Object.entries(openers)) {
  button.prepend(icon(name === 'content' ? 'menu' : name === 'look' ? 'colours' : 'share'));
  button.addEventListener('click', () => openDialog(name));
}

for (const [name, dialog] of Object.entries(dialogs)) {
  dialog.addEventListener('close', () => {
    openers[name].focus();
  });
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) dialog.close();
  });
}

content = createContentPanel(dialogs.content, {
  config,
  onChange: (next) => apply(next),
  onClose: () => dialogs.content.close(),
});

look = createLookPanel(dialogs.look, {
  config,
  onChange: (next) => apply(next),
  onRoll: () => apply(roll(config)),
  onResetView: () => diorama && diorama.resetView(),
});

share = createSharePanel(dialogs.share, {
  onAction: handleShareAction,
});

function refreshFlatFallback(canvas) {
  drawFlat(canvas, code, { ink: paletteFor(config.palette).ink, ground: '#ffffff', pixels: 720 });
}

async function boot() {
  try {
    const { createDiorama } = await Promise.resolve({ createDiorama });
    diorama = createDiorama(stageHost, {
      overlay,
      onState: (state) => {
        const open = state.overlay > 0.5;
        toggle.setAttribute('aria-pressed', String(open));
        toggle.textContent = open ? 'Show the scene' : 'Show the code';
        hint.textContent = open ? 'Point a camera at it.' : 'Tap the scene for the code. Drag to turn it.';
      },
      onView: storeView,
    });
    stageHost.tabIndex = 0;
    stageHost.setAttribute('role', 'button');
    stageHost.setAttribute('aria-label', 'Voxel scene. Activate to flip to the code, or use the arrow keys to turn it.');
    toggle.addEventListener('click', () => diorama.flip.toggle());
  } catch {
    stageHost.classList.add('is-flat');
    const flat = document.createElement('canvas');
    flat.className = 'flat-fallback';
    stageHost.appendChild(flat);
    hint.textContent = 'The 3D view could not load, so here is the flat code.';
    toggle.hidden = true;
    flatFallback = flat;
    refreshFlatFallback(flat);
  }
  refresh();
}

refresh();
boot();

</script>
</body>
</html>
