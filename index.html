<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel QR</title>
<meta name="description" content="Turn a link, contact card or Wi-Fi login into a pastel isometric diorama that flips to reveal a scannable QR code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/styles.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
</head>
<body class="is-editor">
<a class="skip" href="#stage">Skip to the scene</a>

<header class="bar">
  <h1 class="wordmark">Voxel QR</h1>
  <div class="bar-actions">
    <button type="button" id="look-open" class="bar-button" aria-haspopup="dialog">
      <span class="bar-label">Look</span>
    </button>
    <button type="button" id="share-open" class="bar-button" aria-haspopup="dialog">
      <span class="bar-label">Share</span>
    </button>
    <button type="button" id="content-open" class="bar-button bar-menu" aria-haspopup="dialog">
      <span class="bar-label">Content</span>
    </button>
  </div>
</header>

<main class="viewer">
  <div class="stage-wrap">
    <div id="stage" class="stage"></div>
    <canvas id="overlay" class="overlay" aria-hidden="true"></canvas>
  </div>
  <div class="viewer-foot">
    <button type="button" id="toggle" class="toggle" aria-pressed="false">Show the code</button>
    <p id="hint" class="hint">Tap the scene for the code. Drag to turn it.</p>
  </div>
</main>

<dialog id="content-dialog" class="sheet sheet-right" aria-labelledby="content-title"></dialog>
<dialog id="look-dialog" class="glass" aria-labelledby="look-title"></dialog>
<dialog id="share-dialog" class="sheet sheet-center" aria-labelledby="share-title"></dialog>

<p id="toast" class="toast" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
