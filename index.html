<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel QR</title>
<meta name="description" content="Turn a link, contact card or Wi-Fi login into a pastel isometric diorama that flips to reveal a scannable QR code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/styles.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
</head>
<body>
<a class="skip" href="#viewer">Skip to the scene</a>
<div class="shell" id="shell">

  <details class="drawer drawer-content" id="content-drawer" open>
    <summary class="drawer-tab">
      <span class="drawer-title">Content</span>
      <span class="drawer-state" aria-hidden="true"></span>
    </summary>
    <div class="drawer-body" id="content-panel"></div>
  </details>

  <section class="viewer" id="viewer" aria-label="Scene">
    <header class="brand">
      <h1>Voxel QR</h1>
      <p>Hover or tap the scene. It settles into a code you can scan.</p>
    </header>
    <div class="stage-wrap">
      <div id="stage" class="stage"></div>
      <canvas id="overlay" class="overlay" aria-hidden="true"></canvas>
    </div>
    <div class="viewer-foot">
      <button type="button" id="toggle" class="toggle" aria-pressed="false">Show the code</button>
      <p id="hint" class="hint">Point a camera at it.</p>
    </div>
  </section>

  <details class="drawer drawer-style" id="style-drawer" open>
    <summary class="drawer-tab">
      <span class="drawer-title">Look</span>
      <span class="drawer-state" aria-hidden="true"></span>
    </summary>
    <div class="drawer-body" id="style-panel"></div>
  </details>

</div>
<p id="toast" class="toast" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
